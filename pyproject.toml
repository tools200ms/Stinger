[build-system]
requires = ["poetry-core>=1.4.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "stinger"
version = "0.1.0"
description = "Universal MicroPython code for various micro-controllers"
authors = [""]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/tools200ms/Stinger"
repository = "https://github.com/tools200ms/Stinger"
keywords = ["micropython", "microcontrollers"]

[tool.poetry.dependencies]
python = "^3.8"

[tool.poetry.group.dev.dependencies]
uPydev = "^1.1.0"
pytest = "^7.0.0"
ruff = "^0.3.0"
black = "^23.0.0"
isort = "^5.0.0"

